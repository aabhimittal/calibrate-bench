[project]
name = "cbench"
version = "0.1.0"
description = "CALIBRATE-BENCH: an independent audit of decision-model calibration"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "huggingface_hub>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=7"]
runners = ["torch>=2.4", "transformers>=5.14", "pillow"]  # d1-3B's remote code needs transformers>=5.14

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cbench*"]
